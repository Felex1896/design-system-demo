  <body>
    <div class="page">
      <header class="page-header">
        <cc-icon-button class="menu-button" glyph="menu" data-copy="menu.open"></cc-icon-button>
        <cc-select-small id="collection-select"></cc-select-small>
        <cc-select-small id="brand-select"></cc-select-small>
        <cc-mode-switcher id="theme-switch"></cc-mode-switcher>
      </header>
      <div class="page-scroll">
        <div class="family-row"></div>
      </div>
      <cc-scrollbar id="scroll-y" axis="vertical"></cc-scrollbar>
      <cc-scrollbar id="scroll-x" axis="horizontal"></cc-scrollbar>
      <div class="buttons-screen" hidden>
        <div class="buttons-side">
          <div class="buttons-row" id="form-template-row" hidden>
            <span class="buttons-label" id="form-template-label">feature-context</span>
            <cc-select-small id="form-template" aria-labelledby="form-template-label"></cc-select-small>
          </div>
          <div class="buttons-tabs" role="tablist">
            <button class="buttons-tab" id="buttons-tab-settings" type="button" role="tab" aria-selected="true" aria-controls="buttons-panel-settings">Settings</button>
            <button class="buttons-tab" id="buttons-tab-spec" type="button" role="tab" aria-selected="false" aria-controls="buttons-panel-spec">Spec.md</button>
            <button class="buttons-tab" id="buttons-tab-usage" type="button" role="tab" aria-selected="false" aria-controls="buttons-panel-usage">Usage.md</button>
          </div>
          <div class="buttons-panel cc-scroll-hidden" id="buttons-panel-settings" role="tabpanel">
            <div class="buttons-row">
              <span class="buttons-label" id="button-label-class">class</span>
              <cc-select-small id="button-class" aria-labelledby="button-label-class"></cc-select-small>
            </div>
            <div class="buttons-row buttons-only">
              <span class="buttons-label" id="button-label-size">size</span>
              <cc-select-small id="button-size" aria-labelledby="button-label-size"></cc-select-small>
            </div>
            <div class="buttons-row buttons-only">
              <span class="buttons-label" id="button-label-color">color</span>
              <cc-select-small id="button-color" aria-labelledby="button-label-color"></cc-select-small>
            </div>
            <div class="buttons-row buttons-only">
              <span class="buttons-label" id="button-label-style">style</span>
              <cc-select-small id="button-style" aria-labelledby="button-label-style"></cc-select-small>
            </div>
            <div class="buttons-row buttons-only" id="button-row-disabled">
              <span class="buttons-label" id="button-label-disabled">show-disabled</span>
              <button class="buttons-toggle" id="button-show-disabled" type="button" aria-pressed="false" aria-labelledby="button-label-disabled"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row buttons-only" id="button-row-icon">
              <span class="buttons-label" id="button-label-icon">show-icon</span>
              <button class="buttons-toggle" id="button-show-icon" type="button" aria-pressed="true" aria-labelledby="button-label-icon"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row buttons-only">
              <span class="buttons-label" id="button-label-badge">show-badge</span>
              <button class="buttons-toggle" id="button-show-badge" type="button" aria-pressed="false" aria-labelledby="button-label-badge"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row buttons-only" id="button-row-badge-color" hidden>
              <span class="buttons-label" id="button-label-badge-color">badge-color</span>
              <cc-select-small id="button-badge-color" aria-labelledby="button-label-badge-color"></cc-select-small>
            </div>
            <div class="buttons-row demo-only" id="field-row-state" hidden>
              <span class="buttons-label" id="field-label-state">state</span>
              <cc-select-small id="field-state" aria-labelledby="field-label-state"></cc-select-small>
            </div>
            <div class="buttons-row demo-only" id="field-row-placeholder" hidden>
              <span class="buttons-label" id="field-label-placeholder">show-placeholder</span>
              <button class="buttons-toggle" id="field-show-placeholder" type="button" aria-pressed="false" aria-labelledby="field-label-placeholder"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row demo-only" id="field-row-hint" hidden>
              <span class="buttons-label" id="field-label-hint">show-hint</span>
              <button class="buttons-toggle" id="field-show-hint" type="button" aria-pressed="false" aria-labelledby="field-label-hint"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row demo-only" id="field-row-icon" hidden>
              <span class="buttons-label" id="field-label-icon">show-icon</span>
              <button class="buttons-toggle" id="field-show-icon" type="button" aria-pressed="false" aria-labelledby="field-label-icon"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row fields-only" id="field-row-suffix" hidden>
              <span class="buttons-label" id="field-label-suffix">show-suffix</span>
              <button class="buttons-toggle" id="field-show-suffix" type="button" aria-pressed="false" aria-labelledby="field-label-suffix"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row demo-only" id="field-row-trailing" hidden>
              <span class="buttons-label" id="field-label-trailing">show-trailing</span>
              <button class="buttons-toggle" id="field-show-trailing" type="button" aria-pressed="false" aria-labelledby="field-label-trailing"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row demo-only" id="field-row-label" hidden>
              <span class="buttons-label" id="field-label-label">show-label</span>
              <button class="buttons-toggle" id="field-show-label" type="button" aria-pressed="true" aria-labelledby="field-label-label"><span class="buttons-toggle__thumb"></span></button>
            </div>
            <div class="buttons-row demo-only" id="field-row-required" hidden>
              <span class="buttons-label" id="field-label-required">show-required</span>
              <button class="buttons-toggle" id="field-show-required" type="button" aria-pressed="false" aria-labelledby="field-label-required"><span class="buttons-toggle__thumb"></span></button>
            </div>
          </div>
          <div class="buttons-panel cc-scroll-hidden" id="buttons-panel-spec" role="tabpanel" hidden></div>
          <div class="buttons-panel cc-scroll-hidden" id="buttons-panel-usage" role="tabpanel" hidden></div>
          <cc-scrollbar id="buttons-scroll" axis="vertical"></cc-scrollbar>
        </div>
        <div class="buttons-play">
          <div class="buttons-play__caption">
            <span id="buttons-caption"></span>
            <cc-select-small id="form-lang" hidden></cc-select-small>
          </div>
          <div class="buttons-play__stage">
            <demo-button id="demo-button" label="Label"></demo-button>
            <demo-field id="demo-field" hidden></demo-field>
            <cc-select id="demo-select" hidden></cc-select>
            <demo-form id="demo-form" hidden template="booking" lang="en"></demo-form>
          </div>
          <div class="buttons-play__footer">
            <button class="buttons-figma" id="buttons-figma" type="button" tip="above">Open in Figma</button>
            <div class="buttons-play__end">
              <span class="buttons-play__mark">Playground</span>
              <cc-icon-button class="form-mode" id="form-mode" glyph="caret-up"></cc-icon-button>
            </div>
          </div>
        </div>
      </div>
      <cc-sidebar id="sidebar">
        <div id="sidebar-menu" slot="menu"></div>
        <cc-scrollbar id="sidebar-scroll" slot="scrollbar" axis="vertical"></cc-scrollbar>
      </cc-sidebar>
    </div>
    <span hidden data-copy="theme.dark"></span>
    <span hidden data-copy="theme.light"></span>
    <span hidden data-copy="menu.close"></span>

    <script src="components/family/family.js?v=2"></script>
    <script src="components/sidebar/sidebar.js?v=3"></script>
    <script src="components/scrollbar/scrollbar.js?v=4"></script>
    <script src="components/tooltip/tooltip.js?v=14"></script>
    <script src="components/size-row/size-row.js?v=4"></script>
    <script src="components/type-row/type-row.js?v=3"></script>
    <script src="components/shadow-row/shadow-row.js?v=1"></script>
    <script src="components/switcher-end/switcher-end.js?v=1"></script>
    <script type="module" src="src/main.js?v=91"></script>
  </body>
</html>
